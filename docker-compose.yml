services:
  db:
    image: mysql:8.0
    container_name: cinema-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cinema_db
      MYSQL_USER: cinema_user
      MYSQL_PASSWORD: cinema_pass
      MYSQL_ROOT_PASSWORD: rith22
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s

      timeout: 5s
      retries: 10
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: cinema-phpmyadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 100M
    ports:
      - "8083:80"

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: cinema-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Public ping endpoint: returns 200 only once the app has finished
      # cold-starting and made its schema/seeding ready.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/api/shows"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/cinema_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: cinema_user
      SPRING_DATASOURCE_PASSWORD: cinema_pass
      APP_SEED_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000
      SERVER_PORT: 8081
      # Disable DevTools auto-restart: any save in the bind-mounted source
      # used to restart the app (~2 min cold start) and drop in-flight API
      # requests with 500s. Restart explicitly with `docker compose restart`.
      SPRING_DEVTOOLS_RESTART_ENABLED: "false"
      SPRING_DEVTOOLS_LIVERELOAD_ENABLED: "false"
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    volumes:
      - .:/app
      - maven_data:/root/.m2
    ports:
      - "8081:8081"
      - "5005:5005"

volumes:
  mysql_data:
  maven_data:
