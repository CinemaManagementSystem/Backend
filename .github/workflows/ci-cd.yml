name: CI/CD

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

env:
  JAVA_VERSION: "21"
  REGISTRY: ghcr.io

jobs:
  ci:
    name: CI - Test And Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run configured Maven code-quality checks
        shell: bash
        run: |
          set -euo pipefail

          ran_check=false

          if grep -q "<artifactId>spotless-maven-plugin</artifactId>" pom.xml; then
            ./mvnw -B spotless:check
            ran_check=true
          fi

          if grep -q "<artifactId>maven-checkstyle-plugin</artifactId>" pom.xml; then
            ./mvnw -B checkstyle:check
            ran_check=true
          fi

          if grep -q "<artifactId>maven-pmd-plugin</artifactId>" pom.xml; then
            ./mvnw -B pmd:check
            ran_check=true
          fi

          if [ "$ran_check" = false ]; then
            echo "No Maven formatting or code-quality plugin is configured in pom.xml."
            echo "Qodana is configured separately in .github/workflows/qodana_code_quality.yml."
          fi

      - name: Run unit and integration tests
        run: ./mvnw -B test

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: surefire-test-reports
          path: |
            target/surefire-reports/**
          retention-days: 7

      - name: Build Spring Boot application
        run: ./mvnw -B -DskipTests package

  docker-build:
    name: Docker - Build
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set lowercase image name
        id: image
        shell: bash
        run: |
          echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short,prefix=sha-

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-publish:
    name: Docker - Publish To GHCR
    runs-on: ubuntu-latest
    needs:
      - ci
      - docker-build
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set lowercase image name
        id: image
        shell: bash
        run: |
          echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=sha,format=short,prefix=sha-

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy - Optional SSH Placeholder
    runs-on: ubuntu-latest
    needs:
      - ci
      - docker-publish
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    permissions:
      contents: read
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}

    steps:
      - name: Check deployment secrets
        id: deploy_secrets
        shell: bash
        run: |
          if [ -n "$SERVER_HOST" ] && [ -n "$SERVER_USER" ] && [ -n "$SERVER_SSH_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deployment skipped. Configure SERVER_HOST, SERVER_USER, and SERVER_SSH_KEY to enable SSH deployment."
          fi

      - name: Add SSH key
        if: steps.deploy_secrets.outputs.ready == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Deployment placeholder
        if: steps.deploy_secrets.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "SSH deployment secrets are configured."
          echo "Add your server-specific Docker Compose deployment commands here."
          echo "Example flow for Ubuntu:"
          echo "1. SSH to the configured server"
          echo "2. Pull the GHCR image or run docker compose pull"
          echo "3. Run docker compose up -d"
